# Runs the reproduction on every push and on demand. Two jobs:
#   bug     — engine v0.107.1: passes when the bug IS reproduced (DAG 1 stuck)
#   control — engine v0.101.27: passes when DAG 1 finalizes (COMPLETED)
# A fixed engine would flip `bug` red — point BUG_IMAGE at a candidate build to test a fix.
name: repro
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bug_image:
        description: engine image to test for the bug
        default: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.107.1
jobs:
  bug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make up wait token
        env: { BUG_IMAGE: "${{ inputs.bug_image || 'ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.107.1' }}" }
      - run: make run
      - run: make run
      - run: make check
      - run: make assert-bug
      - if: always()
        run: make down
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make up wait token
        env: { ENGINE_IMAGE: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.101.27 }
      - run: make run
      - run: make check
      - run: make assert-fixed
      - if: always()
        run: make down
